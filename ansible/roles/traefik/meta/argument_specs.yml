argument_specs:
  main:
    short_description: Traefik for the estate's admin hostnames, as a pinned binary under systemd
    description:
      - Installs Traefik pinned by version and checksum, and runs it as the
        user traefik, which binds 443 with CAP_NET_BIND_SERVICE alone. It
        serves Proxmox, PBS and RustFS, with certificates from Let's Encrypt
        by DNS challenge with Cloudflare. There is no port 80, no dashboard
        and no ACME contact email.
      - The Cloudflare token goes into an environment file only root and
        traefik can read. It is never on a command line.
    options:
      traefik_version:
        type: str
        default: "3.7.20"
        description: Release to install, without the v.
      traefik_tarball_sha256:
        type: str
        default: 389736d8b121d4d41e044294df03ba4d8fe4ea3744e38ae270c10fbdaab8e10a
        description: SHA-256 of that release's traefik_v<version>_linux_amd64.tar.gz, from its checksums file.
      traefik_node_address:
        type: str
        required: true
        description: The node's address in this zone, where Proxmox answers on 8006 and PBS on 8007.
      traefik_cloudflare_dns_api_token:
        type: str
        required: true
        no_log: true
        description: Cloudflare token with Zone, DNS, Edit on 0xc0.cc, for the ACME DNS challenge.
      traefik_acme_resolvers:
        type: list
        elements: str
        default: ["1.1.1.1:53", "8.8.8.8:53"]
        description: DNS resolvers the DNS challenge checks its record with.
