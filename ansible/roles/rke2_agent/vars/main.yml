rke2_agent_minor: "{{ rke2_agent_version.split('.')[0:2] | join('.') }}"
rke2_agent_repo_url: "https://rpm.rancher.io/rke2/{{ rke2_agent_channel }}"
rke2_agent_gpg_key: https://rpm.rancher.io/public.key

# 20261109.0 and not the newest, 20261116.0: that one adds a device-cgroup
# filter with an open report against it (gvisor#17779).
rke2_agent_gvisor_release: "20261109.0"
rke2_agent_gvisor_sha512: 0a0041fd862f4ea3042a9db8d41c742f48a01f909699adc2a0256e46d85e53f97b82b9fd154b3dce636f62b8d557677639f91c77d13f3f875ff9fa535275393c
rke2_agent_gvisor_url: "https://storage.googleapis.com/gvisor/releases/release/{{ rke2_agent_gvisor_release }}/x86_64/gvisor.tar.zstd"
# runsc looks for gvisor-bin/ beside itself, and the shim finds runsc on PATH.
rke2_agent_gvisor_bin_dir: /usr/local/bin
rke2_agent_gvisor_stage_dir: "/var/lib/gvisor/{{ rke2_agent_gvisor_release }}"
rke2_agent_gvisor_config: /etc/containerd/runsc.toml
rke2_agent_gvisor_fcontexts:
  - "{{ rke2_agent_gvisor_bin_dir }}/runsc"
  - "{{ rke2_agent_gvisor_bin_dir }}/containerd-shim-runsc-v1"
  - "{{ rke2_agent_gvisor_bin_dir }}/gvisor-bin(/.*)?"
rke2_agent_containerd_template: /var/lib/rancher/rke2/agent/etc/containerd/config-v3.toml.tmpl
