- name: Create the config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the config's drop-in directory
  ansible.builtin.file:
    path: /etc/rancher/rke2/config.yaml.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the RKE2 config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart rke2-agent

- name: Set the node's labels and taints
  ansible.builtin.include_role:
    name: rke2_server
    tasks_from: node_pool
  vars:
    rke2_server_node_labels: "{{ rke2_agent_node_labels }}"
    rke2_server_node_taints: "{{ rke2_agent_node_taints }}"
