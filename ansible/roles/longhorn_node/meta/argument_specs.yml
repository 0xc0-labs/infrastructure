argument_specs:
  main:
    short_description: An RKE2 server ready for Longhorn
    description:
      - Installs what Longhorn needs on the host (open-iscsi, pinned, and
        cryptsetup), loads its kernel modules and starts iscsid.
      - Joins the VM's blank data disks into one LVM volume, formatted XFS and
        mounted at Longhorn's data path. Refuses a disk that already carries
        any signature rather than format it.
      - When the disks have grown, grows the physical volumes, the logical
        volume and the XFS filesystem to match, online. It changes nothing when
        nothing grew.
      - When the root disk has grown, grows the root partition (the last one on
        the disk) and its XFS filesystem to match, online. It changes nothing
        when nothing grew.
    options:
      longhorn_node_disks:
        type: list
        elements: str
        description: The blank data disks, by a stable path. Never the system disk.
      longhorn_node_path:
        type: str
        default: /var/lib/longhorn
        description: Where the volume is mounted, Longhorn's default data path.
      longhorn_node_iscsi_version:
        type: str
        default: "6.2.1.11"
        description: iscsi-initiator-utils upstream version, with no release. 6.2.1.11 is open-iscsi 2.1.11; Longhorn breaks on 2.1.12.
