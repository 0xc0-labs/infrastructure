- name: Look for local etcd data
  ansible.builtin.stat:
    path: "{{ rke2_server_etcd_dir }}"
  register: rke2_server_etcd

# Straight to each peer, not through the VIP: a cluster whose load balancer is
# down must still be found, or this host would start a second one.
- name: Probe the peers' supervisors
  ansible.builtin.command:
    cmd: timeout 3 bash -c 'exec 3<>/dev/tcp/{{ item }}/9345'
  loop: "{{ rke2_server_peers }}"
  register: rke2_server_probe
  changed_when: false
  failed_when: false
  check_mode: false

# The bootstrap host joins only when rebuilt into a running cluster.
- name: Decide whether to join or initialise
  ansible.builtin.set_fact:
    rke2_server_peers_up: "{{ rke2_server_probe.results | selectattr('rc', 'equalto', 0) | list | length > 0 }}"
    rke2_server_join: >-
      {{ not rke2_server_bootstrap
         or (not rke2_server_etcd.stat.exists
             and rke2_server_probe.results | selectattr('rc', 'equalto', 0) | list | length > 0) }}

- name: Refuse to start a second cluster, or join nothing
  ansible.builtin.assert:
    that: rke2_server_etcd.stat.exists or rke2_server_bootstrap or rke2_server_peers_up
    fail_msg: >-
      No peer answers on 9345 and this is not the bootstrap host. Bring up the
      bootstrap server first, or fix the network: there is no cluster to join.
  # On a first dry run no peer is up; the others show as joining, as for real.
  when: not ansible_check_mode

- name: Create the config directory and its drop-in directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/rancher/rke2, mode: "0700" }
    - { path: "{{ rke2_server_config_dropin_dir }}", mode: "0755" }

# RKE2 creates this directory when it starts, so a first run makes it. No
# notify: the API server watches the file and reloads it by itself.
- name: Create the directory of the API server's configuration files
  ansible.builtin.file:
    path: "{{ rke2_server_authentication_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the API server's authentication configuration
  ansible.builtin.template:
    src: authentication-config.yaml.j2
    dest: "{{ rke2_server_authentication_config }}"
    owner: root
    group: root
    mode: "0600"

- name: Read the SELinux type of the API server's configuration files
  ansible.builtin.command:
    cmd: >-
      stat -c %C
      {{ rke2_server_authentication_config }}
      {{ rke2_server_authentication_config | dirname }}/egress-selector-config.yaml
  register: rke2_server_authentication_context
  changed_when: false
  failed_when: false
  check_mode: false

# The sibling exists once RKE2 has started; a first run has nothing to compare.
- name: Check the file has its sibling's SELinux type
  ansible.builtin.assert:
    that: >-
      rke2_server_authentication_context.stdout_lines | map('split', ':') | map(attribute=2) | unique | length == 1
    fail_msg: >-
      {{ rke2_server_authentication_config }} does not carry the SELinux type of
      egress-selector-config.yaml: {{ rke2_server_authentication_context.stdout_lines }}
  when:
    - not ansible_check_mode
    - rke2_server_authentication_context.stdout_lines | length == 2

- name: Write the RKE2 config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart rke2-server

# On a first run RKE2 has not started yet, so it has not created it.
- name: Create the manifests directory
  ansible.builtin.file:
    path: "{{ rke2_server_manifests_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the pod network's chart values
  ansible.builtin.template:
    src: rke2-canal-config.yaml.j2
    dest: "{{ rke2_server_manifests_dir }}/rke2-canal-config.yaml"
    owner: root
    group: root
    mode: "0600"
  notify: Roll canal
