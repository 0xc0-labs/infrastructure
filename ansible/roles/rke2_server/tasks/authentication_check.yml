# The handler that restarts the server runs at the end of the play otherwise,
# after this check.
- name: Restart rke2-server now if its config changed
  ansible.builtin.meta: flush_handlers

- name: Read the checksum of the authentication configuration
  ansible.builtin.stat:
    path: "{{ rke2_server_authentication_config }}"
    checksum_algorithm: sha256
  register: rke2_server_authentication_file
  check_mode: false
  when: not rke2_server_pending

# The API server sets this metric when it starts, and again on every reload,
# with the SHA-256 of the file it loaded: a server that came back without the
# argument does not have it at all. In a dry run the file is not there yet, so
# the checksum defaults to empty and the skipped task still renders.
- name: Wait for the API server to report the file the role wrote
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      {{ rke2_server_kubectl }} get --raw /metrics
      | grep -F '{{ rke2_server_authentication_metric }}{'
      | grep -cF ',hash="sha256:{{ rke2_server_authentication_file.stat.checksum | default('') }}"'
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ rke2_server_kubeconfig }}"
  register: rke2_server_authentication_loaded
  until: rke2_server_authentication_loaded.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when: not rke2_server_pending
