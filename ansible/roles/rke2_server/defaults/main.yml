# The cluster's version is set in the inventory (group_vars/platform.yml).
rke2_server_version: "1.36.4~rke2r1"
rke2_server_selinux_version: "0.23"
rke2_server_channel: stable

# The cluster's ingress comes from gitops, managed by ArgoCD.
rke2_server_ingress_controller: none

rke2_server_tls_san: []

# The guests' 1400 minus VXLAN's 50 bytes of header.
rke2_server_canal_veth_mtu: 1350

rke2_server_node_labels: {}
rke2_server_node_taints: []

# JWT authenticators of the API server's authentication configuration, each
# as in apiserver.config.k8s.io/v1. Empty trusts no issuer.
rke2_server_authentication_jwt: []
