argument_specs:
  main:
    short_description: Ephemeral GitHub Actions runners registered just in time by a GitHub App
    description:
      - Installs the runner pinned by version and checksum, once, root's,
        and runs each instance as a systemd service from a state directory
        of its own, emptied on every start, where the install is mounted
        read only. The runner never updates itself. A change restarts only
        the idle runners; a busy one starts on it when its job ends, so the
        job applying it is never cut. Before every start, a root-only step
        uses the GitHub App to fetch a just-in-time config, which reaches the
        runner as a systemd credential, so each runner takes one job,
        deregisters and starts clean.
      - The App's key never reaches the VM. That step logs in to Vault with an
        AppRole secret ID and has Transit sign the App's JWT.
      - Each instance's jobs run as an unprivileged user of its own,
        runner-<n>, which cannot read the secret ID, nor anything of the other
        instance's. Its state directory, with the work folder, and its home
        are emptied before and after every job.
      - Each instance has its own rootless BuildKit, run by RootlessKit as a
        user of its own, buildkit-<n>, with its own subordinate IDs. The
        runner starts it empty before every job and stops it after, removing
        what it built. The job reaches it only through its Unix socket, at
        $BUILDKIT_HOST (README.md).
    options:
      github_runner_app_id:
        type: str
        required: true
        description: ID of the GitHub App that registers the runners.
      github_runner_app_installation_id:
        type: str
        required: true
        description: Installation ID of that App on the org.
      github_runner_approle_secret_id:
        type: str
        required: true
        no_log: true
        description: Secret ID of the runners' AppRole role, from Vault through scripts/ansible.
      github_runner_vault_addr:
        type: str
        default: https://vault.int.0xc0.cc
        description: Vault's address, as the VM resolves it.
      github_runner_approle_role_id:
        type: str
        default: github-runner
        description: Role ID of the runners' AppRole role, which is its name.
      github_runner_transit_key:
        type: str
        default: github-runner-app
        description: Transit key holding the App's private key.
      github_runner_version:
        type: str
        default: "2.338.0"
        description: Runner release to install.
      github_runner_tarball_sha256:
        type: str
        required: true
        description: SHA-256 of that release's actions-runner-linux-x64 tarball.
      github_runner_count:
        type: int
        default: 2
        description: Runners on this VM, each taking one job at a time.
      github_runner_buildkit_version:
        type: str
        default: "0.34.0"
        description: BuildKit release the instances' daemons run.
      github_runner_buildkit_tarball_sha256:
        type: str
        required: true
        description: SHA-256 of that release's buildkit linux-amd64 tarball.
      github_runner_rootlesskit_version:
        type: str
        default: "3.2.0"
        description: RootlessKit release that runs them.
      github_runner_rootlesskit_tarball_sha256:
        type: str
        required: true
        description: SHA-256 of that release's rootlesskit-x86_64 tarball.
      github_runner_buildkit_subid_start:
        type: int
        default: 1000000000
        description: First subordinate ID of instance 1's BuildKit user; each instance takes the next 65536.
      github_runner_group:
        type: str
        default: "0xc0"
        description: Runner group they register into; several names, space-separated, take the first that exists.
      github_runner_labels:
        type: list
        elements: str
        default: ["0xc0"]
        description: Custom labels workflows target.
      github_runner_hosts:
        type: list
        elements: dict
        default: []
        description: Extra /etc/hosts entries for the jobs, for names inside the network with no public record.
        options:
          address:
            type: str
            required: true
          names:
            type: list
            elements: str
            required: true
  install:
    short_description: What a runner VM needs, without the runners
    description:
      - The packages, the runner pinned by version and checksum, unpacked
        once and root's, and its system dependencies; BuildKit and RootlessKit pinned the same way,
        uidmap, and the kernel setting rootless builds need. No App, no key, no
        users, no units; this is what the runner template bakes, with Packer.
    options:
      github_runner_version:
        type: str
        default: "2.338.0"
        description: Runner release to install.
      github_runner_tarball_sha256:
        type: str
        required: true
        description: SHA-256 of that release's actions-runner-linux-x64 tarball.
      github_runner_buildkit_version:
        type: str
        default: "0.34.0"
        description: BuildKit release to install.
      github_runner_buildkit_tarball_sha256:
        type: str
        required: true
        description: SHA-256 of that release's buildkit linux-amd64 tarball.
      github_runner_rootlesskit_version:
        type: str
        default: "3.2.0"
        description: RootlessKit release to install.
      github_runner_rootlesskit_tarball_sha256:
        type: str
        required: true
        description: SHA-256 of that release's rootlesskit-x86_64 tarball.
