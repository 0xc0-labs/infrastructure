- name: Apply the kernel settings
  ansible.builtin.command:
    cmd: sysctl --load /etc/sysctl.d/60-github-runner.conf
  changed_when: true
  when: not ansible_check_mode

- name: Apply the memory settings
  ansible.builtin.command:
    cmd: sysctl --load /etc/sysctl.d/61-github-runner-memory.conf
  changed_when: true
  when: not ansible_check_mode

# Only the idle runners: a busy one may be running the job that applies this.
- name: Restart idle runners
  ansible.builtin.command:
    cmd: /usr/local/libexec/github-runner-restart-idle
  register: github_runner_restart
  changed_when: "'restarted' in github_runner_restart.stdout"
  when: not (ansible_check_mode and github_runner_unit.changed)
