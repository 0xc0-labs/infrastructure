# Never baked: the secret ID is a secret, and the count belongs to the VM.

- name: Refuse an empty AppRole secret ID
  ansible.builtin.assert:
    that: github_runner_approle_secret_id | length > 0
    fail_msg: No AppRole secret ID. Run through scripts/ansible, which reads it from Vault.
  no_log: true

- name: Create the App config directory
  ansible.builtin.file:
    path: /etc/github-runner
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the AppRole secret ID
  ansible.builtin.copy:
    dest: /etc/github-runner/approle-secret-id
    content: "{{ github_runner_approle_secret_id }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the App settings
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/github-runner/app.env
    owner: root
    group: root
    mode: "0600"

- name: Install the JIT step
  ansible.builtin.template:
    src: github-runner-jit.j2
    dest: /usr/local/libexec/github-runner-jit
    owner: root
    group: root
    mode: "0700"

# Why one per instance: README.md, One instance.
- name: Create a user per runner instance
  ansible.builtin.user:
    name: "runner-{{ item }}"
    system: true
    shell: /bin/bash
    home: "/home/runner-{{ item }}"
    create_home: true
  loop: "{{ range(1, github_runner_count + 1) | list }}"

# Why a user of its own: README.md, Rootless. Its home is the state its unit
# empties before and after every job.
- name: Create a BuildKit user per runner instance
  ansible.builtin.user:
    name: "buildkit-{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/github-runner-buildkit/{{ item }}"
    create_home: false
  loop: "{{ range(1, github_runner_count + 1) | list }}"

- name: Give each BuildKit user its subordinate IDs
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "^buildkit-{{ item.1 }}:"
    line: "buildkit-{{ item.1 }}:{{ github_runner_buildkit_subid_start + (item.1 - 1) * 65536 }}:65536"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['/etc/subuid', '/etc/subgid'] | product(range(1, github_runner_count + 1)) | list }}"
  loop_control:
    label: "{{ item.0 }} buildkit-{{ item.1 }}"

- name: Install the runner helpers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/libexec/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: [github-runner-busy, github-runner-prune, github-runner-reset, github-runner-restart-idle]

# The one helper the instance's user runs: it starts the listener.
- name: Install the listener's start
  ansible.builtin.template:
    src: github-runner-listen.j2
    dest: /usr/local/libexec/github-runner-listen
    owner: root
    group: root
    mode: "0755"

- name: Create the runners' state directory
  ansible.builtin.file:
    path: /var/lib/github-runner
    state: directory
    owner: root
    group: root
    mode: "0755"

# The unit's StateDirectory= creates it too; github-runner-reset empties it
# before every start.
- name: Create each instance's state directory
  ansible.builtin.file:
    path: "/var/lib/github-runner/{{ item }}"
    state: directory
    owner: "runner-{{ item }}"
    group: "runner-{{ item }}"
    mode: "0700"
  loop: "{{ range(1, github_runner_count + 1) | list }}"

# Where the unit mounts the install's bin/ and externals/, read only.
- name: Create the install's mount points in each state directory
  ansible.builtin.file:
    path: "/var/lib/github-runner/{{ item.0 }}/{{ item.1 }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ range(1, github_runner_count + 1) | product(['bin', 'externals']) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"

# Loaded by each instance's BuildKit when it starts, not here: a busy
# instance's build keeps the network it started with (#204).
- name: Write each BuildKit's network rules
  ansible.builtin.template:
    src: buildkit.nft.j2
    dest: "/etc/github-runner/buildkit-{{ item }}.nft"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ range(1, github_runner_count + 1) | list }}"

- name: Install the BuildKit unit
  ansible.builtin.template:
    src: github-runner-buildkit@.service.j2
    dest: /etc/systemd/system/github-runner-buildkit@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart idle runners

- name: Install the systemd unit
  ansible.builtin.template:
    src: github-runner@.service.j2
    dest: /etc/systemd/system/github-runner@.service
    owner: root
    group: root
    mode: "0644"
  register: github_runner_unit
  notify: Restart idle runners

- name: Enable and start the runners
  ansible.builtin.systemd_service:
    name: "github-runner@{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  when: not (ansible_check_mode and github_runner_unit.changed)

# cloud-init renders /etc/hosts from its template at every boot
# (manage_etc_hosts in the user-data), so the entry goes in the template too.
- name: Resolve the network's private names for the jobs
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} github_runner: private names"
    block: |
      {% for h in github_runner_hosts %}
      {{ h.address }} {{ h.names | join(' ') }}
      {% endfor %}
    state: "{{ 'present' if github_runner_hosts | length > 0 else 'absent' }}"
  loop:
    - /etc/hosts
    - /etc/cloud/templates/hosts.debian.tmpl
