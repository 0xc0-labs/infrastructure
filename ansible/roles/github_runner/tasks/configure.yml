# Never baked: the secret ID is a secret, and the count belongs to the VM.

- name: Refuse an empty AppRole secret ID
  ansible.builtin.assert:
    that: github_runner_approle_secret_id | length > 0
    fail_msg: No AppRole secret ID. Run through scripts/ansible, which reads it from Vault.
  no_log: true

- name: Create the App config directory
  ansible.builtin.file:
    path: /etc/github-runner
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the AppRole secret ID
  ansible.builtin.copy:
    dest: /etc/github-runner/approle-secret-id
    content: "{{ github_runner_approle_secret_id }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the App settings
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/github-runner/app.env
    owner: root
    group: root
    mode: "0600"

- name: Install the JIT step
  ansible.builtin.template:
    src: github-runner-jit.j2
    dest: /usr/local/libexec/github-runner-jit
    owner: root
    group: root
    mode: "0700"

# After the JIT step that no longer reads it: Vault signs with the key now.
- name: Remove the App key
  ansible.builtin.file:
    path: /etc/github-runner/app.pem
    state: absent

# One user per instance, so a job cannot read the other instance's work, home,
# environment or BuildKit, as it could when both ran as one user.
- name: Create a user per runner instance
  ansible.builtin.user:
    name: "runner-{{ item }}"
    system: true
    shell: /bin/bash
    home: "/home/runner-{{ item }}"
    create_home: true
  loop: "{{ range(1, github_runner_count + 1) | list }}"

# Another user for the instance's BuildKit: its job reaches the daemon through
# the socket alone, and never runs, nor controls, a process without
# NoNewPrivileges. Its home is the state its unit empties before and after
# every job.
- name: Create a BuildKit user per runner instance
  ansible.builtin.user:
    name: "buildkit-{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/github-runner-buildkit/{{ item }}"
    create_home: false
  loop: "{{ range(1, github_runner_count + 1) | list }}"

# Every ID a build uses but root maps onto these: one range per instance, never
# shared with the other instance nor with a range useradd hands out.
- name: Give each BuildKit user its subordinate IDs
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "^buildkit-{{ item.1 }}:"
    line: "buildkit-{{ item.1 }}:{{ github_runner_buildkit_subid_start + (item.1 - 1) * 65536 }}:65536"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['/etc/subuid', '/etc/subgid'] | product(range(1, github_runner_count + 1)) | list }}"
  loop_control:
    label: "{{ item.0 }} buildkit-{{ item.1 }}"

- name: Install the runner helpers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/libexec/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop: [github-runner-busy, github-runner-prune, github-runner-reset, github-runner-restart-idle]
  register: github_runner_helpers

# A job running from one copy keeps it while the next version unpacks beside it.
# Only a missing copy is created: an existing one keeps its owner here, and
# goes to the instance's user on its runner's next start (github-runner-reset),
# so a busy job never loses its own directory.
- name: Create a directory per runner and version
  ansible.builtin.command:
    cmd: "install -d -o runner-{{ item }} -g runner-{{ item }} -m 0750 /opt/actions-runner/{{ item }}-{{ github_runner_version }}"
    creates: "/opt/actions-runner/{{ item }}-{{ github_runner_version }}"
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  register: github_runner_copies

# A runner that updated itself in place is left alone until the next bump. As
# root, which reads a copy whatever its owner, and hands the new one to the
# instance's user.
- name: Unpack the runner
  ansible.builtin.command:
    cmd: >-
      sh -c 'tar --no-same-owner -xzf /var/cache/actions-runner-{{ github_runner_version }}.tar.gz
      && touch .version-{{ github_runner_version }}
      && chown -R runner-{{ item }}:runner-{{ item }} .'
    chdir: "/opt/actions-runner/{{ item }}-{{ github_runner_version }}"
    creates: "/opt/actions-runner/{{ item }}-{{ github_runner_version }}/.version-{{ github_runner_version }}"
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  when: not (ansible_check_mode and (github_runner_tarball.changed or github_runner_copies.changed))

# A plain directory from before the versioned copies: renamed, the next start
# of that instance prunes it.
- name: Look for a runner directory from before the versioned copies
  ansible.builtin.stat:
    path: "/opt/actions-runner/{{ item }}"
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  register: github_runner_legacy

# Moved under a running job, its paths would break: a busy one moves on the
# next run.
- name: Find the busy runners
  ansible.builtin.command:
    cmd: "/usr/local/libexec/github-runner-busy {{ item }}"
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  register: github_runner_probe
  changed_when: false
  failed_when: github_runner_probe.rc not in [0, 1]
  check_mode: false
  when: not (ansible_check_mode and github_runner_helpers.changed)

- name: Note the legacy directories held by a busy runner
  ansible.builtin.set_fact:
    github_runner_held: >-
      {{ github_runner_legacy.results
         | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | rejectattr('stat.islnk')
         | map(attribute='item')
         | select('in', github_runner_probe.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list)
         | list }}

- name: Move it aside
  ansible.builtin.command:
    cmd: "mv /opt/actions-runner/{{ item.item }} /opt/actions-runner/{{ item.item }}-legacy"
    creates: "/opt/actions-runner/{{ item.item }}-legacy"
  loop: "{{ github_runner_legacy.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.isdir | default(false) and not item.stat.islnk and item.item not in github_runner_held

# The link is root's, like its directory, and only the link: with follow, the
# module would give its owner to the copy the link points to, the one a busy
# runner is running from, and lock that runner out of it (#204).
- name: Point each runner at its copy
  ansible.builtin.file:
    path: "/opt/actions-runner/{{ item }}"
    src: "/opt/actions-runner/{{ item }}-{{ github_runner_version }}"
    state: link
    owner: root
    group: root
    follow: false
    force: true
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  when:
    - item not in github_runner_held
    - not (ansible_check_mode and (github_runner_tarball.changed or github_runner_copies.changed))
  notify: Restart idle runners

# Started and stopped by its runner, around every job: never enabled itself.
- name: Install the BuildKit unit
  ansible.builtin.template:
    src: github-runner-buildkit@.service.j2
    dest: /etc/systemd/system/github-runner-buildkit@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart idle runners

- name: Install the systemd unit
  ansible.builtin.template:
    src: github-runner@.service.j2
    dest: /etc/systemd/system/github-runner@.service
    owner: root
    group: root
    mode: "0644"
  register: github_runner_unit
  notify: Restart idle runners

- name: Enable and start the runners
  ansible.builtin.systemd_service:
    name: "github-runner@{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ range(1, github_runner_count + 1) | list }}"
  when: not (ansible_check_mode and github_runner_unit.changed)

- name: Resolve the network's private names for the jobs
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} github_runner: private names"
    block: |
      {% for h in github_runner_hosts %}
      {{ h.address }} {{ h.names | join(' ') }}
      {% endfor %}
    state: "{{ 'present' if github_runner_hosts | length > 0 else 'absent' }}"

# The idle runners start again now, each as its instance's user, so that only
# a busy one may still run as the user both instances shared before.
- name: Restart the idle runners onto their own users
  ansible.builtin.meta: flush_handlers

- name: Look for the user both instances shared before
  ansible.builtin.getent:
    database: passwd

- name: Find what still runs as it
  ansible.builtin.command:
    cmd: pgrep -u runner
  register: github_runner_shared_user_procs
  changed_when: false
  failed_when: github_runner_shared_user_procs.rc not in [0, 1]
  check_mode: false
  when: "'runner' in ansible_facts.getent_passwd"

# Its home holds what earlier jobs cached. A busy runner keeps it until the
# next run.
- name: Remove it, with its home, once nothing runs as it
  ansible.builtin.user:
    name: runner
    state: absent
    remove: true
  when:
    - "'runner' in ansible_facts.getent_passwd"
    - github_runner_shared_user_procs.rc == 1
