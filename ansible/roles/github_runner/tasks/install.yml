# Baked into the runner template by Packer; a no-op on a VM cloned from it.

- name: Install what the JIT step and the jobs need
  ansible.builtin.apt:
    name: [curl, jq, openssl, git, tar, unzip, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download runner {{ github_runner_version }}
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-x64-{{ github_runner_version }}.tar.gz"
    dest: "/var/cache/actions-runner-{{ github_runner_version }}.tar.gz"
    checksum: "sha256:{{ github_runner_tarball_sha256 }}"
    mode: "0644"
  register: github_runner_tarball

# Root's: tar as root would keep the tarball's owner, a UID that may be anyone's
# on the VM. One directory per version: README.md, A run of the role, under
# running jobs.
- name: Unpack runner {{ github_runner_version }}
  ansible.builtin.command:
    cmd: >-
      sh -c 'mkdir -p /opt/actions-runner/{{ github_runner_version }}
      && tar --no-same-owner -xzf /var/cache/actions-runner-{{ github_runner_version }}.tar.gz
      -C /opt/actions-runner/{{ github_runner_version }}
      && touch /opt/actions-runner/{{ github_runner_version }}/.unpacked'
    creates: /opt/actions-runner/{{ github_runner_version }}/.unpacked
  when: not (ansible_check_mode and github_runner_tarball.changed)
  register: github_runner_unpacked

- name: Install the runner's system dependencies
  ansible.builtin.command:
    cmd: >-
      sh -c './bin/installdependencies.sh
      && touch /var/lib/actions-runner-deps-{{ github_runner_version }}'
    chdir: /opt/actions-runner/{{ github_runner_version }}
    creates: /var/lib/actions-runner-deps-{{ github_runner_version }}
  when: not (ansible_check_mode and (github_runner_tarball.changed or github_runner_unpacked.changed))

# What each one is for: README.md, Rootless.
- name: Install what rootless BuildKit needs
  ansible.builtin.apt:
    name: [uidmap, slirp4netns, nftables]
    state: present

# Debian allows it already: this keeps it so.
- name: Allow unprivileged user namespaces
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-github-runner.conf
    content: |
      # Managed by Ansible (github_runner): rootless BuildKit runs every build
      # in a user namespace of its own.
      kernel.unprivileged_userns_clone = 1
    owner: root
    group: root
    mode: "0644"
  notify: Apply the kernel settings

# Loaded at boot rather than left to the first mount, which comes from inside a
# user namespace (README.md, Rootless).
- name: Load overlayfs on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/github-runner.conf
    content: |
      # Managed by Ansible (github_runner): rootless BuildKit's snapshotter.
      overlay
    owner: root
    group: root
    mode: "0644"

- name: Look for overlayfs
  ansible.builtin.stat:
    path: /sys/module/overlay
  register: github_runner_overlay

- name: Load overlayfs now
  ansible.builtin.command:
    cmd: modprobe overlay
  changed_when: true
  when: not github_runner_overlay.stat.exists

- name: Download BuildKit {{ github_runner_buildkit_version }}
  vars:
    github_runner_buildkit_tag: "v{{ github_runner_buildkit_version }}"
  ansible.builtin.get_url:
    url: "https://github.com/moby/buildkit/releases/download/{{ github_runner_buildkit_tag }}/buildkit-{{ github_runner_buildkit_tag }}.linux-amd64.tar.gz"
    dest: "/var/cache/buildkit-{{ github_runner_buildkit_version }}.tar.gz"
    checksum: "sha256:{{ github_runner_buildkit_tarball_sha256 }}"
    mode: "0644"
  register: github_runner_buildkit_tarball

- name: Download RootlessKit {{ github_runner_rootlesskit_version }}
  ansible.builtin.get_url:
    url: "https://github.com/rootless-containers/rootlesskit/releases/download/v{{ github_runner_rootlesskit_version }}/rootlesskit-x86_64.tar.gz"
    dest: "/var/cache/rootlesskit-{{ github_runner_rootlesskit_version }}.tar.gz"
    checksum: "sha256:{{ github_runner_rootlesskit_tarball_sha256 }}"
    mode: "0644"
  register: github_runner_rootlesskit_tarball

# A directory per version (README.md, Rootless). Only what the rootless OCI
# worker runs: no CNI, no QEMU.
- name: Unpack BuildKit
  ansible.builtin.command:
    cmd: >-
      sh -c 'mkdir -p /opt/buildkit/{{ github_runner_buildkit_version }}
      && tar -xzf /var/cache/buildkit-{{ github_runner_buildkit_version }}.tar.gz
      -C /opt/buildkit/{{ github_runner_buildkit_version }} bin/buildctl bin/buildkitd bin/buildkit-runc
      && touch /opt/buildkit/{{ github_runner_buildkit_version }}/.unpacked'
    creates: /opt/buildkit/{{ github_runner_buildkit_version }}/.unpacked
  when: not (ansible_check_mode and github_runner_buildkit_tarball.changed)
  register: github_runner_buildkit_unpacked

- name: Unpack RootlessKit
  ansible.builtin.command:
    cmd: >-
      sh -c 'mkdir -p /opt/rootlesskit/{{ github_runner_rootlesskit_version }}
      && tar -xzf /var/cache/rootlesskit-{{ github_runner_rootlesskit_version }}.tar.gz
      -C /opt/rootlesskit/{{ github_runner_rootlesskit_version }} rootlesskit
      && touch /opt/rootlesskit/{{ github_runner_rootlesskit_version }}/.unpacked'
    creates: /opt/rootlesskit/{{ github_runner_rootlesskit_version }}/.unpacked
  when: not (ansible_check_mode and github_runner_rootlesskit_tarball.changed)

- name: Put buildctl on the jobs' PATH
  ansible.builtin.file:
    path: /usr/local/bin/buildctl
    src: /opt/buildkit/{{ github_runner_buildkit_version }}/bin/buildctl
    state: link
    force: true
  when: not (ansible_check_mode and (github_runner_buildkit_tarball.changed or github_runner_buildkit_unpacked.changed))
