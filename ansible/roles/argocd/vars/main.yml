# Every RKE2 server applies what it finds here, and again whenever it changes.
argocd_manifests_dir: /var/lib/rancher/rke2/server/manifests
argocd_chart_repo: https://argoproj.github.io/argo-helm

argocd_values:
  global:
    image: "{{ argocd_image }}"
    # Dex builds its redirect from the URL the chart derives from this.
    domain: argocd.int.0xc0.cc
  redis:
    image: "{{ argocd_redis_image }}"
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
  dex:
    enabled: true
    image: "{{ argocd_dex_image }}"
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
  configs:
    secret:
      argocdServerAdminPassword: "{{ argocd_admin_password_bcrypt }}"
    # gitops inflates its charts through Kustomize's helmCharts.
    cm:
      kustomize.buildOptions: --enable-helm
      # The $<secret>:<key> references are Argo CD's, resolved from a Secret
      # labelled app.kubernetes.io/part-of: argocd (gitops delivers it).
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $argocd-github-oauth:client_id
              clientSecret: $argocd-github-oauth:client_secret
              orgs:
                - name: 0xc0-labs
                  teams:
                    - admins
    # Dex names a team <org>:<team>. The default policy is empty: a GitHub user
    # outside the team gets nothing.
    rbac:
      policy.default: ""
      policy.csv: |
        g, 0xc0-labs:admins, role:admin
    # Plain HTTP: Traefik ends TLS.
    params:
      server.insecure: true
      otlp.address: otel-gateway.opentelemetry.svc.cluster.local:4317
      otlp.insecure: true
  # Prometheus (kube-prometheus-stack, in gitops) finds the ServiceMonitors.
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 50m, memory: 1Gi}
      limits: {memory: 2Gi}
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 256Mi}
      limits: {memory: 512Mi}
  # Renders Helm and Kustomize, which spikes.
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 256Mi}
      limits: {memory: 1Gi}
  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 256Mi}
      limits: {memory: 512Mi}
  notifications:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
