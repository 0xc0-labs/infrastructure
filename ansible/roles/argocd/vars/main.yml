# Every RKE2 server applies what it finds here, and again whenever it changes.
argocd_manifests_dir: /var/lib/rancher/rke2/server/manifests
argocd_chart_repo: https://argoproj.github.io/argo-helm

argocd_values:
  global:
    image: "{{ argocd_image }}"
    # argocd-cm's url, and so the OIDC redirect, derive from this.
    domain: argocd.int.0xc0.cc
  redis:
    image: "{{ argocd_redis_image }}"
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
  dex:
    enabled: false
  configs:
    secret:
      argocdServerAdminPassword: "{{ argocd_admin_password_bcrypt }}"
    # gitops inflates its charts through Kustomize's helmCharts.
    cm:
      kustomize.buildOptions: --enable-helm
      # The $<secret>:<key> references are Argo CD's, resolved from a Secret
      # labelled app.kubernetes.io/part-of: argocd (gitops delivers it).
      oidc.config: |
        name: Cloudflare Access
        issuer: https://0xc0.cloudflareaccess.com/cdn-cgi/access/sso/oidc/f9f9f5de60201dde55364a8adb78333dca7b613ef5d506c9e9cc6b70e3486ad6
        clientID: $argocd-oidc:client_id
        clientSecret: $argocd-oidc:client_secret
        requestedScopes:
          - openid
          - profile
          - email
    # Cloudflare's application for Argo CD admits only the team
    # 0xc0-labs/admins and the operator's emails, so whoever signs in is an
    # admin: admission is decided there, once (0xc0-labs/workspace#310).
    rbac:
      policy.default: role:admin
    # Plain HTTP: Traefik ends TLS.
    params:
      server.insecure: true
      otlp.address: otel-gateway.opentelemetry.svc.cluster.local:4317
      otlp.insecure: true
  # Prometheus (kube-prometheus-stack, in gitops) finds the ServiceMonitors.
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 50m, memory: 1Gi}
      limits: {memory: 2Gi}
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 256Mi}
      limits: {memory: 512Mi}
  # Renders Helm and Kustomize, which spikes.
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 256Mi}
      limits: {memory: 1Gi}
  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 256Mi}
      limits: {memory: 512Mi}
  notifications:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
