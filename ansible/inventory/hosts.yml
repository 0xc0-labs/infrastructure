# Mirrors the vms and cluster maps in environments/prod/terraform.tfvars.
all:
  children:
    vms:
      children:
        mgmt:
          children:
            access:
              hosts:
                vm-access-01:
                  ansible_host: 10.10.0.10
                vm-access-02:
                  ansible_host: 10.10.0.20
        ci:
          hosts:
            vm-ci-01:
              ansible_host: 10.10.1.10
            vm-ci-02:
              ansible_host: 10.10.1.20
        # Not in ci: vm-ci.yml must never reach it.
        base_services:
          hosts:
            ct-base-01:
              ansible_host: 10.10.1.30
        platform:
          children:
            lb:
              hosts:
                vm-lb-01:
                  ansible_host: 10.10.4.11
                vm-lb-02:
                  ansible_host: 10.10.4.12
            rke2_servers:
              hosts:
                vm-rke2-01:
                  ansible_host: 10.10.4.21
                  rke2_node_labels:
                    0xc0.cc/pool: infra
                vm-rke2-02:
                  ansible_host: 10.10.4.22
                  rke2_node_labels:
                    0xc0.cc/pool: infra
                vm-rke2-03:
                  ansible_host: 10.10.4.23
                  rke2_node_labels:
                    0xc0.cc/pool: infra
            rke2_agents:
              hosts:
                vm-rke2-04:
                  ansible_host: 10.10.4.24
                  # No taint yet: the apps taint comes later, inside a maintenance window.
                  rke2_node_labels:
                    0xc0.cc/pool: apps
                vm-rke2-05:
                  ansible_host: 10.10.4.25
                  rke2_node_labels:
                    0xc0.cc/pool: apps
                # The sandboxes' node (workspace#288), on pve-1, with no data disks.
                vm-rke2-06:
                  ansible_host: 10.10.4.26
                  rke2_agent_container_selinux: false
                  rke2_agent_gvisor: true
                  rke2_node_longhorn: false
                  rke2_node_labels:
                    0xc0.cc/pool: sandbox
                  rke2_node_taints:
                    - 0xc0.cc/pool=sandbox:NoSchedule
