# Every playbook runs from the pipeline (operator decision, 2026-09-29): for
# real on a merge to main, once the operator approves production.
name: ansible

on:
  pull_request:
    branches: [main]
    paths: ['ansible/**', 'scripts/ansible', 'scripts/vault-env', 'scripts/python-env', 'pyproject.toml', 'uv.lock', '.github/workflows/ansible.yml']
  push:
    branches: [main]
    paths: ['ansible/**', 'scripts/ansible', 'scripts/vault-env', 'scripts/python-env', 'pyproject.toml', 'uv.lock', '.github/workflows/ansible.yml']

# id-token: the job logs in to Vault with GitHub's OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  # One playbook per job, chained, so they run in this order: the cluster
  # first; the CI VMs last, since their runners run this job, and a busy one is
  # left for its next start. One job with max-parallel: 1 would not keep it:
  # GitHub queues a matrix's jobs in an order of its own (#205). A playbook
  # that fails does not stop the next: each holds its own hosts. Each is
  # approved for production as its turn comes.
  cluster:
    uses: 0xc0-labs/.github/.github/workflows/ansible.yml@main
    with:
      playbooks: playbooks/cluster.yml
      # mise's tools only: Ansible comes from uv.lock (scripts/python-env).
      tools: &tools opentofu jq uv
      # The wrapper reads the tunnel token and the admin keys from this root.
      tofu-root: &tofu-root environments/prod
      vault-addr: &vault-addr https://vault.int.0xc0.cc
      vault-role: &vault-role infrastructure
      vault-secrets: &vault-secrets |
        ci/data/shared/rustfs access_key_id | AWS_ACCESS_KEY_ID ;
        ci/data/shared/rustfs secret_access_key | AWS_SECRET_ACCESS_KEY ;
        ci/data/infrastructure/ssh private_key | CI_SSH_PRIVATE_KEY ;
        ci/data/infrastructure/runner-approle secret_id | GITHUB_RUNNER_APPROLE_SECRET_ID ;
        ci/data/infrastructure/rke2 token | RKE2_TOKEN ;
        platform/data/argocd/admin password_bcrypt | ARGOCD_ADMIN_PASSWORD_BCRYPT ;
      ssh-key-env: &ssh-key-env CI_SSH_PRIVATE_KEY

  vm-access:
    needs: cluster
    if: ${{ !cancelled() }}
    uses: 0xc0-labs/.github/.github/workflows/ansible.yml@main
    with:
      playbooks: playbooks/vm-access.yml
      tools: *tools
      tofu-root: *tofu-root
      vault-addr: *vault-addr
      vault-role: *vault-role
      vault-secrets: *vault-secrets
      ssh-key-env: *ssh-key-env

  vm-ci:
    needs: vm-access
    if: ${{ !cancelled() }}
    uses: 0xc0-labs/.github/.github/workflows/ansible.yml@main
    with:
      playbooks: playbooks/vm-ci.yml
      tools: *tools
      tofu-root: *tofu-root
      vault-addr: *vault-addr
      vault-role: *vault-role
      vault-secrets: *vault-secrets
      ssh-key-env: *ssh-key-env
